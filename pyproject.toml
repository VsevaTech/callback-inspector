[project]
name = "callback-inspector"
version = "0.1.0"
description = "Outbound callback proxy with full delivery history and manual retry — proof for 'we sent it, they say they didn't get it'."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends(...) in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]
