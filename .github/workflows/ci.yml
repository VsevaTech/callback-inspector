name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format check)
        run: ruff format --check .
      - name: pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test the demo scenario end-to-end
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && curl -fs http://localhost:8001/health && break
            sleep 1
          done
          bash examples/demo.sh
          docker compose down -v
      - name: Secure delivery demo (HMAC valid, secrets redacted, idempotent replay, 409 conflict)
        run: |
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.secure-demo.yml"
          $COMPOSE up -d
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && curl -fs http://localhost:8001/health && break
            sleep 1
          done
          bash examples/demo.sh                    # 503 -> retry -> 200 still works with signing on
          bash examples/demo_secure_delivery.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.secure-demo.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.secure-demo.yml down -v
