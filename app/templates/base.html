<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Callback Inspector{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <script>window.htmx || document.write('<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"><\/script>');</script>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --muted:#8b93a7;
            --ok:#2ecc71; --bad:#ff5c5c; --warn:#f5b942; --accent:#6ea8fe; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
    header h1 { margin:0; font-size:18px; }
    header a { color:var(--muted); text-decoration:none; }
    header a:hover { color:var(--text); }
    main { max-width:1200px; margin:0 auto; padding:24px; }
    .grid { display:grid; grid-template-columns: 380px 1fr; gap:24px; align-items:start; }
    @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
    .panel h2 { margin:0 0 12px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input, select, textarea { width:100%; background:#0c0e12; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    textarea { min-height:90px; resize:vertical; }
    button { background:var(--accent); color:#0b1220; border:0; border-radius:6px; padding:9px 14px; font-weight:600; cursor:pointer; margin-top:12px; }
    button.secondary { background:#2a3040; color:var(--text); }
    button:disabled { opacity:.5; cursor:default; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:12px; color:var(--muted); font-weight:600; }
    td.mono, .mono { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
    .badge.delivered { background:rgba(46,204,113,.15); color:var(--ok); }
    .badge.failed { background:rgba(255,92,92,.15); color:var(--bad); }
    .badge.pending { background:rgba(245,185,66,.15); color:var(--warn); }
    .muted { color:var(--muted); }
    .error { color:var(--bad); background:rgba(255,92,92,.08); border:1px solid rgba(255,92,92,.3); padding:8px 10px; border-radius:6px; margin:8px 0; }
    pre { background:#0c0e12; border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; max-height:320px; margin:6px 0 0; font-size:12.5px; }
    .kv { display:grid; grid-template-columns: 160px 1fr; gap:6px 12px; }
    .kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-all; }
    a { color:var(--accent); }
    .attempt { border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; }
    .attempt h3 { margin:0 0 8px; font-size:14px; display:flex; align-items:center; gap:10px; }
    .htmx-request .spinner { display:inline; } .spinner { display:none; }
    details summary { cursor:pointer; color:var(--muted); margin-top:8px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/" style="color:inherit">Callback Inspector</a></h1>
    <a href="/docs">API docs</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
