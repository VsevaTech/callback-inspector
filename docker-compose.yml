services:
  inspector:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    container_name: callback-inspector
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////srv/data/callback_inspector.db
      DEFAULT_TIMEOUT_SECONDS: ${DEFAULT_TIMEOUT_SECONDS:-10}
      DEMO_DESTINATION_URL: http://receiver:8001/callback
      # Security (see .env.example). Signing is off unless configured; the secret comes from the environment.
      SENSITIVE_HEADERS: ${SENSITIVE_HEADERS:-}
      CALLBACK_SIGNING_ENABLED: ${CALLBACK_SIGNING_ENABLED:-false}
      CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET:-}
      CALLBACK_SIGNATURE_HEADER: ${CALLBACK_SIGNATURE_HEADER:-X-Callback-Signature}
      CALLBACK_TIMESTAMP_HEADER: ${CALLBACK_TIMESTAMP_HEADER:-X-Callback-Timestamp}
    volumes:
      - inspector-data:/srv/data
    depends_on:
      receiver:
        condition: service_started

  receiver:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    container_name: callback-receiver
    command: ["uvicorn", "app.mock_receiver:receiver_app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      # Demo-only: when set, the receiver rejects callbacks without a valid HMAC signature (401).
      SIGNATURE_SECRET: ${RECEIVER_SIGNATURE_SECRET:-}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  inspector-data:
